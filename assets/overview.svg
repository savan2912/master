<svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Back card -->
    <rect
        x="5"
        y="4"
        width="14"
        height="14"
        rx="3"
        stroke="currentColor"
        stroke-width="2"
        opacity="0.4"/>

    <!-- Front card -->
    <rect
        x="3"
        y="7"
        width="14"
        height="14"
        rx="3"
        stroke="currentColor"
        stroke-width="2"/>

    <!-- Small indicator line -->
    <path
        d="M7 11H13"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"/>

</svg>